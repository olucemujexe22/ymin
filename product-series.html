            '超高耐温': 'Ultra-high-temperature capability',
            '高耐温': 'High-temperature capability',
            '超高温': 'Ultra-high temperature',
            '耐高温': 'High-temperature capability',
            '高可靠性': 'High reliability',
            '高可靠': 'High reliability',
            '小尺寸化': 'Compact size',
            '小型化': 'Compact size',
            '薄型': 'Low profile',
            '高容量': 'High capacitance',
            '叠层型': 'Stacked type',
            '贴片型': 'SMD',
            '引线型': 'Radial',
            '牛角型': 'Snap-in',
            '插针式': 'Through-hole',
            '基板自立型': 'Snap-in',
            '螺栓型': 'Screw-terminal',
            '双电层单体': 'EDLC cells',
            '双电层模组': 'EDLC modules',
            '单体': 'Cell',
            '模组': 'Module',
            '灌胶': 'Potted',
            '套管': 'Sleeved',
            '根据应用': 'Application dependent',
            '定制': 'Custom',
            '专用': 'Application specific',
            '直径': 'diameter',
            '万次': '0,000 cycles',
            '逆变器': 'Inverters',
            '变流器': 'Converters',
            '变频器': 'Inverters',
            '中频炉': 'Medium-frequency furnaces',
            '工控': 'Industrial control',
            '光伏': 'Photovoltaics',
            '电源': 'Power supplies',
            '变频': 'Variable-frequency drives',
            '开发中 敬请期待': 'Under development',
            '按产品体系图补充': 'To be supplemented according to the product portfolio',
            '品': 'product'
        };
        var seriesEnglishKeys = Object.keys(seriesEnglishTerms).sort(function(a, b) { return b.length - a.length; });

        function isEnglishSeriesPage() {
            return !!(window.YMIN && YMIN.i18n && YMIN.i18n.language === 'en');
        }

        function displaySeriesText(value) {
            var result = String(value == null ? '' : value);
            if (!isEnglishSeriesPage()) return result;
            if (YMIN.i18n && typeof YMIN.i18n.t === 'function') {
                var translated = YMIN.i18n.t(result);
                if (!/[\u3400-\u9fff]/.test(translated)) return translated;
            }
            seriesEnglishKeys.forEach(function(source) {
                if (result.indexOf(source) !== -1) result = result.split(source).join(seriesEnglishTerms[source]);
            });
            return result.replace(/\s{2,}/g, ' ').trim();
        }

        function initPage() {
            // 填充产品线筛选下拉
            var lineFilter = document.getElementById('lineFilter');
            var packageFilter = document.getElementById('packageFilter');
            var lines = YMIN.seriesTable.getProductLines();
            lines.forEach(function(line) {
                var opt = document.createElement('option');
                opt.value = line;
                opt.textContent = displaySeriesText(line);
                lineFilter.appendChild(opt);
            });
            ['贴片型', '引线型', '牛角型', '插针式'].forEach(function(pkg) {
                var opt = document.createElement('option');
                opt.value = pkg;
                opt.textContent = displaySeriesText(pkg);
                packageFilter.appendChild(opt);
            });

            // 检查 URL 参数 ?line=xxx
            var lineParam = getUrlParam('line');
            if (lineParam) {
                // 尝试匹配产品线
                var matched = null;
                for (var i = 0; i < lines.length; i++) {
                    if (lines[i] === lineParam) { matched = lineParam; break; }
                }
                if (matched) {
                    currentLineFilter = matched;
                    currentPackageFilter = null;
                    lineFilter.value = matched;
                    renderTable(YMIN.seriesTable.filterByLine(matched));
                    renderDiagram(matched, null);
                    return;
                }
            }

            // 无参数或未匹配：显示全部
            currentLineFilter = null;
            currentPackageFilter = null;
            renderTable(YMIN.seriesTable.getAll());
            renderDiagram(null, null);
        }

        // ---- Tab 切换 ----
        function switchTab(tab) {
            var listTab = document.getElementById('tab-list');
            var diagramTab = document.getElementById('tab-diagram');
            var listBtn = document.getElementById('tab-list-btn');
            var diagramBtn = document.getElementById('tab-diagram-btn');

            if (tab === 'list') {
                listTab.classList.remove('hidden');
                diagramTab.classList.add('hidden');
                listBtn.classList.add('active');
                diagramBtn.classList.remove('active');
            } else {
                listTab.classList.add('hidden');
                diagramTab.classList.remove('hidden');
                listBtn.classList.remove('active');
                diagramBtn.classList.add('active');
                // 切到系统图时，按当前筛选重渲染
                renderDiagram(currentLineFilter, currentPackageFilter);
            }
        }

        // ---- 表格渲染 ----
        function filterTable() {
            var line = document.getElementById('lineFilter').value;
            currentLineFilter = (line === '全部') ? null : line;
            var pkg = document.getElementById('packageFilter').value;
            currentPackageFilter = (pkg === '全部封装') ? null : pkg;
            var search = document.getElementById('seriesSearch').value.toUpperCase();
            var data = YMIN.seriesTable.filterByLine(line);
            if (currentPackageFilter) {
                data = data.filter(function(row) {
                    return row.pkg === currentPackageFilter;
                });
            }
            if (search) {
                data = data.filter(function(row) {
                    return row.series.toUpperCase().indexOf(search) >= 0 ||
                           row.feature.toUpperCase().indexOf(search) >= 0;
                });
            }
            renderTable(data);
            // 同步更新系统图
            renderDiagram(currentLineFilter, currentPackageFilter);
        }

        function renderTable(data) {
            var tbody = document.getElementById('tableBody');
            document.getElementById('resultCount').textContent = isEnglishSeriesPage() ? data.length + ' series' : '共 ' + data.length + ' 个系列';
            var html = '';
            data.forEach(function(row) {
                var aecBadge = row.aec ? '<span class="text-[10px] bg-green-50 text-green-700 px-1.5 py-0.5 font-medium">AEC-Q200</span>' : '<span class="text-[10px] text-slate-300">-</span>';
                var rohsBadge = row.rohs ? '<span class="text-[10px] bg-blue-50 text-blue-700 px-1.5 py-0.5 font-medium">RoHS</span>' : '';
                var pdfHtml = row.pdf
                    ? '<a href="' + row.pdf + '" target="_blank" class="inline-flex items-center gap-1 text-red-600 hover:text-red-800 font-medium"><span class="material-symbols-outlined text-lg">picture_as_pdf</span></a>'
                    : '<span class="text-slate-300 text-xs">-</span>';

                html += '<tr class="hover:bg-slate-50 transition-colors">';
                html += '<td class="p-4 font-bold text-primary">' + row.series + '</td>';
                html += '<td class="p-4 text-xs">' + escapeHtml(displaySeriesText(row.productLine)) + '</td>';
                html += '<td class="p-4">' + escapeHtml(displaySeriesText(row.pkg)) + '</td>';
                html += '<td class="p-4">' + escapeHtml(displaySeriesText(row.voltage)) + '</td>';
                html += '<td class="p-4">' + escapeHtml(displaySeriesText(row.cap)) + '</td>';
                html += '<td class="p-4">' + escapeHtml(displaySeriesText(row.temp)) + '</td>';
                html += '<td class="p-4">' + escapeHtml(displaySeriesText(row.life)) + '</td>';
                html += '<td class="p-4 text-xs max-w-[200px]">' + escapeHtml(displaySeriesText(row.feature)) + '</td>';
                html += '<td class="p-4 text-center"><div class="flex gap-1 justify-center">' + aecBadge + rohsBadge + '</div></td>';
                html += '<td class="p-4 text-center">' + pdfHtml + '</td>';
                html += '</tr>';
            });
            tbody.innerHTML = html;
        }

        function escapeHtml(value) {
            return String(value == null ? '' : value).replace(/[&<>"']/g, function(ch) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                }[ch];
            });
        }

        function padNumber(num) {
            return String(num).padStart(2, '0');
        }

        function chunkSeries(seriesList) {
            var size = seriesList.length > 3 ? 4 : Math.max(seriesList.length, 1);
            var rows = [];
            for (var i = 0; i < seriesList.length; i += size) {
                rows.push(seriesList.slice(i, i + size));
            }
            return rows;
        }

        function renderSeriesCard(series, line, index) {
            var seriesName = escapeHtml(series.name);
            var seriesUrl = 'product-center.html?category=' + encodeURIComponent(line.name) + '&series=' + encodeURIComponent(series.name);
            var cardNo = series.no || index;
            var meta = [series.temp, series.life, series.voltage].filter(Boolean).map(function(value) {
                return escapeHtml(displaySeriesText(value));
            }).join(' · ');
            var desc = escapeHtml(displaySeriesText(series.desc || ''));
            var color = escapeHtml(line.color);
            var tint = color + '14';

            var html = '';
            html += '<div class="diagram-card-wrap">';
            html += '<a href="' + seriesUrl + '" class="diagram-series-card" style="border-color:' + color + ';">';
            html += '<div class="diagram-card-head" style="background:' + tint + '; border-bottom-color:' + color + ';">';
            html += '<span class="diagram-card-no" style="background:' + color + ';">' + padNumber(cardNo) + '</span>';
            html += '<span class="diagram-card-name" style="color:' + color + ';">' + seriesName + '</span>';
            html += '</div>';
            html += '<div class="diagram-card-body">';
            if (meta) html += '<div class="diagram-card-meta">' + meta + '</div>';
            if (desc) html += '<div class="diagram-card-desc">' + desc + '</div>';
            html += '</div>';
            html += '</a>';
            html += '</div>';
            return html;
        }

        function renderSeriesCardAt(series, line, index, pos, layout) {
            var style = 'left:' + pos.x + 'px; top:' + pos.y + 'px; --card-width:' + layout.cardWidth + 'px; --card-height:' + layout.cardHeight + 'px;';
            return renderSeriesCard(series, line, index).replace('<div class="diagram-card-wrap">', '<div class="diagram-card-wrap" style="' + style + '">');
        }

        function getArrowPoints(arrow, layout) {
            var from = layout.nodes[arrow.from];
            var to = layout.nodes[arrow.to];
            var w = layout.cardWidth;
            var h = layout.cardHeight;
            if (!from || !to) return null;

            if (arrow.dir === 'left') {
                return {
                    x1: from.x,
                    y1: from.y + h / 2,
                    x2: to.x + w,
                    y2: to.y + h / 2
                };
            }
            if (arrow.dir === 'up') {
                return {
                    x1: from.x + w / 2,
                    y1: from.y,
                    x2: to.x + w / 2,
                    y2: to.y + h
                };
            }
            if (arrow.dir === 'down') {
                return {
                    x1: from.x + w / 2,
                    y1: from.y + h,
                    x2: to.x + w / 2,
                    y2: to.y
                };
            }
            return {
                x1: from.x + w,
                y1: from.y + h / 2,
                x2: to.x,
                y2: to.y + h / 2
            };
        }

        function getSeriesPackageMap() {
            var map = {};
            YMIN.seriesTable.getAll().forEach(function(row) {
                if (!map[row.series]) map[row.series] = row.pkg;
            });
            return map;
        }

        function filterPackageByPackageField(pkg, packageFilter, seriesPackageMap) {
            if (!packageFilter) return pkg;
            var filteredSeries = pkg.series.filter(function(series) {
                return seriesPackageMap[series.name] === packageFilter;
            });
            if (!filteredSeries.length) return null;
            var clone = {};
            for (var key in pkg) {
                if (Object.prototype.hasOwnProperty.call(pkg, key)) clone[key] = pkg[key];
            }
            clone.series = filteredSeries;
            return clone;
        }

        function renderPackageMap(pkg, line, startIndex) {
            var layout = pkg.layout;
            var seriesByName = {};
            pkg.series.forEach(function(series) {
                seriesByName[series.name] = series;
            });

            var html = '';
            html += '<div class="diagram-package">';
            html += '<div class="diagram-package-head" style="min-width:' + layout.width + 'px;">';
            html += '<span class="diagram-package-label">' + escapeHtml(displaySeriesText(pkg.name)) + '</span>';
            html += '<span class="diagram-package-count">' + (isEnglishSeriesPage() ? pkg.series.length + ' series' : pkg.series.length + ' 个系列') + '</span>';
            html += '<span class="flex-1 h-px bg-slate-300"></span>';
            html += '</div>';
            html += '<div class="diagram-map" style="--map-width:' + layout.width + 'px; --map-height:' + layout.height + 'px;">';
            if (layout.labelBox) {
                html += '<div class="diagram-map-label" style="left:' + layout.labelBox.x + 'px; top:' + layout.labelBox.y + 'px; width:' + layout.labelBox.w + 'px; height:' + layout.labelBox.h + 'px;">' + escapeHtml(displaySeriesText(layout.label || pkg.name)) + '</div>';
            }
            html += '<svg class="diagram-map-svg" viewBox="0 0 ' + layout.width + ' ' + layout.height + '" preserveAspectRatio="none" aria-hidden="true">';
            html += '<defs><marker id="arrow-' + escapeHtml(layout.type) + '" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"></path></marker></defs>';
            (layout.arrows || []).forEach(function(arrow) {
                if (!seriesByName[arrow.from] || !seriesByName[arrow.to]) return;
                var pts = getArrowPoints(arrow, layout);
                if (!pts) return;
                html += '<line x1="' + pts.x1 + '" y1="' + pts.y1 + '" x2="' + pts.x2 + '" y2="' + pts.y2 + '" stroke="#334155" stroke-width="2" marker-end="url(#arrow-' + escapeHtml(layout.type) + ')"></line>';
            });
            html += '</svg>';
            pkg.series.forEach(function(series, i) {
                var pos = layout.nodes[series.name];
                if (pos) html += renderSeriesCardAt(series, line, startIndex + i, pos, layout);
            });
            html += '</div>';
            html += '</div>';
            return { html: html, nextIndex: startIndex + pkg.series.length };
        }

        function renderPackageFlow(pkg, line, startIndex) {
            if (pkg.layout && pkg.layout.nodes) {
                return renderPackageMap(pkg, line, startIndex);
            }

            var rows = chunkSeries(pkg.series);
            var index = startIndex;
            var html = '';

            html += '<div class="diagram-package">';
            html += '<div class="diagram-package-head">';
            html += '<span class="diagram-package-label">' + escapeHtml(displaySeriesText(pkg.name)) + '</span>';
            html += '<span class="diagram-package-count">' + (isEnglishSeriesPage() ? pkg.series.length + ' series' : pkg.series.length + ' 个系列') + '</span>';
            html += '<span class="flex-1 h-px bg-slate-300"></span>';
            html += '</div>';

            html += '<div class="diagram-flow">';
            rows.forEach(function(row) {
                html += '<div class="diagram-row">';
                row.forEach(function(series, ri) {
                    html += renderSeriesCard(series, line, index++);
                    if (ri < row.length - 1) {
                        html += '<span class="diagram-arrow" aria-hidden="true"></span>';
                    }
                });
                html += '</div>';
            });
            html += '</div>';
            html += '</div>';

            return { html: html, nextIndex: index };
        }

        function renderReferenceImages(line) {
            var images = line.diagramImages || [];
            var html = '';
            if (!images.length) return html;

            html += '<details class="diagram-reference">';
            html += '<summary>' + (isEnglishSeriesPage() ? 'View Original Product Portfolio Image' : '查看原始体系图图片') + '</summary>';
            if (images.length === 1) {
                html += '<img src="' + escapeHtml(images[0]) + '" alt="' + escapeHtml(displaySeriesText(line.name)) + (isEnglishSeriesPage() ? ' product portfolio' : '体系图') + '" class="w-full border border-slate-200 shadow-sm mt-4" style="max-width:900px;">';
            } else {
                html += '<div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mt-4">';
                images.forEach(function(img) {
                    html += '<img src="' + escapeHtml(img) + '" alt="' + escapeHtml(displaySeriesText(line.name)) + (isEnglishSeriesPage() ? ' product portfolio' : '体系图') + '" class="w-full border border-slate-200 shadow-sm">';
                });
                html += '</div>';
            }
            html += '</details>';
            return html;
        }

        // ---- 系统图渲染 ----
        function renderDiagram(lineFilter, packageFilter) {
            var container = document.getElementById('diagramContainer');
            var allLines = YMIN.seriesDiagram.getAll();
            var lines = lineFilter
                ? allLines.filter(function(l) { return l.name === lineFilter; })
                : allLines;
            var seriesPackageMap = getSeriesPackageMap();
            var html = '';

            var filterBar = document.getElementById('diagramFilterBar');
            var filterName = document.getElementById('diagramFilterName');
            if (lineFilter || packageFilter) {
                filterBar.classList.remove('hidden');
                filterName.textContent = [lineFilter, packageFilter].filter(Boolean).map(displaySeriesText).join(' / ');
            } else {
                filterBar.classList.add('hidden');
            }

            if (lines.length === 0) {
                html += '<div class="text-center py-12 text-slate-400"><span class="material-symbols-outlined text-4xl mb-2 block">search_off</span><p>' + (isEnglishSeriesPage() ? 'No matching product line found' : '未找到匹配的产品线') + '</p></div>';
                container.innerHTML = html;
                return;
            }

            lines.forEach(function(line, li) {
                var cardIndex = 1;
                var displayPackages = [];
                line.packages.forEach(function(pkg) {
                    var filteredPkg = filterPackageByPackageField(pkg, packageFilter, seriesPackageMap);
                    if (filteredPkg) displayPackages.push(filteredPkg);
                });
                if (displayPackages.length === 0) return;
                html += '<section class="diagram-line">';
                html += '<div class="diagram-line-heading">';
                html += '<div class="diagram-line-mark" style="background:' + escapeHtml(line.color) + '"></div>';
                html += '<div><h3 class="text-xl font-bold text-primary">' + escapeHtml(displaySeriesText(line.name)) + '</h3>';
                html += '<p class="text-[10px] text-slate-400 uppercase tracking-wider">' + escapeHtml(line.nameEn) + '</p></div>';
                html += '<span class="ml-auto text-[10px] text-slate-400 uppercase tracking-wider">' + (isEnglishSeriesPage() ? displayPackages.length + ' package groups' : displayPackages.length + ' 个封装分组') + '</span>';
                html += '</div>';

                displayPackages.forEach(function(pkg) {
                    var flow = renderPackageFlow(pkg, line, cardIndex);
                    html += flow.html;
                    cardIndex = flow.nextIndex;
                });

                html += renderReferenceImages(line);
                html += '</section>';
            });

            container.innerHTML = html;
            if (!html) {
                container.innerHTML = '<div class="text-center py-12 text-slate-400"><span class="material-symbols-outlined text-4xl mb-2 block">search_off</span><p>' + (isEnglishSeriesPage() ? 'No matching package type found' : '未找到匹配的封装形式') + '</p></div>';
            }
        }

        // ---- 清除筛选 ----
        function clearFilter() {
            document.getElementById('lineFilter').value = '全部';
            document.getElementById('packageFilter').value = '全部封装';
            document.getElementById('seriesSearch').value = '';
            currentLineFilter = null;
            currentPackageFilter = null;
            renderTable(YMIN.seriesTable.getAll());
            renderDiagram(null, null);
        }
    </script>
