<!DOCTYPE html>
<html class="light" lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width,initial-scale=1.0" name="viewport">
    <title>新闻资讯与技术文章 - 永铭电子</title>
    <meta name="description" content="永铭电子新闻资讯与技术文章，包含产品动态、选型说明、应用案例和行业解决方案全文。">
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/common.css">
    <link rel="stylesheet" href="styles/support-content.css">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config={darkMode:"class",theme:{extend:{colors:{"primary":"#1B365D"},borderRadius:{"DEFAULT":"0px"},fontFamily:{"headline":["Space Grotesk"],"body":["Inter"]}}}}
    </script>
</head>
<body data-support-page="news-list" class="bg-surface text-on-surface flex flex-col h-screen overflow-hidden">
    <header id="ymin-navbar"></header>
    <main class="support-page flex-1 overflow-y-auto custom-scrollbar">
        <div class="support-container">
            <nav class="support-breadcrumb" aria-label="面包屑">
                <a href="index.html">首页</a><span>/</span>
                <a href="support.html">服务支持</a><span>/</span>
                <span>新闻资讯</span>
            </nav>
            <section class="support-hero">
                <div class="support-hero-grid">
                    <div>
                        <h1>从技术问题，读到完整方案</h1>
                        <p>聚合永铭官网产品动态与技术文章。支持从应用领域、产品系列和关键词定位内容，并直接阅读原文全文。</p>
                    </div>
                    <div class="support-stat-row">
                        <div class="support-stat"><strong data-article-count>—</strong><span>完整文章</span></div>
                        <div class="support-stat"><strong data-faq-count>—</strong><span>关联FAQ</span></div>
                    </div>
                </div>
            </section>
            <div class="support-search" role="search">
                <span class="material-symbols-outlined">search</span>
                <input id="news-search" type="search" placeholder="输入应用、产品系列、料号或技术问题">
                <button id="news-search-button" type="button">搜索文章</button>
            </div>
            <section class="support-section" aria-labelledby="featured-title">
                <div class="support-section-heading">
                    <div>
                        <h2 id="featured-title">重点内容</h2>
                        <p>优先展示近期发布且包含完整图文资料的文章。</p>
                    </div>
                </div>
                <div class="news-featured" id="news-featured">
                    <div class="support-loading">
                        <span class="material-symbols-outlined">progress_activity</span>
                        正在加载重点文章
                    </div>
                </div>
            </section>
            <section class="support-content-grid" aria-label="新闻筛选与文章列表">
                <aside class="support-filter-panel">
                    <h3>筛选内容<span class="material-symbols-outlined">tune</span></h3>
                    <div class="support-filter-group">
                        <label class="support-filter-label">内容类型</label>
                        <div class="support-chip-list" id="news-type-tabs"></div>
                    </div>
                    <div class="support-filter-group">
                        <label class="support-filter-label" for="news-app-select">应用领域</label>
                        <select class="support-select" id="news-app-select"></select>
                    </div>
                    <div class="support-filter-group">
                        <label class="support-filter-label" for="news-series-input">产品系列</label>
                        <input class="support-filter-input" id="news-series-input" type="text" placeholder="例如 LKM、CW3H">
                    </div>
                    <button class="support-reset" id="news-reset" type="button">清除全部筛选</button>
                </aside>
                <div class="support-results">
                    <div class="support-toolbar">
                        <div class="support-result-count" id="news-count">正在读取文章…</div>
                        <div class="support-active-filters" id="news-active-filters"></div>
                    </div>
                    <div class="news-list" id="news-results">
                        <div class="support-loading">
                            <span class="material-symbols-outlined">progress_activity</span>
                            正在加载文章
                        </div>
                    </div>
                    <div class="support-pagination" id="news-pagination"></div>
                </div>
            </section>
        </div>
        <footer id="ymin-footer"></footer>
    </main>
    <script src="components/i18n.js?v=20260805merge10"></script>
    <script src="components/navbar.js?v=20260805merge3"></script>
    <script src="components/footer.js?v=20260805merge4"></script>
    <script src="data/support-articles-en.js?v=20260805merge1"></script>
    <script src="components/support-content.js?v=20260805merge4"></script>
</body>
</html>
