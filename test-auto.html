<!DOCTYPE html><html><head><meta charset="utf-8"><title>Test</title></head><body>
<h1>Testing system-modules.js + automotive page</h1>
<div id="output"></div>
<script src="data/system-modules.js"></script>
<script>
var out = document.getElementById('output');
try {
    // Test SPECS access
    if (typeof YMIN !== 'undefined' && YMIN.sysMod) {
        var specs = YMIN.sysMod.getSpecs('automotive', '电机驱动', '电机控制器-MCU');
        out.innerHTML = '<p style=color:green>✓ system-modules.js loaded OK</p>';
        out.innerHTML += '<p>getSpecs returned: ' + (specs ? specs.length + ' specs' : 'null') + '</p>';
        if (specs) {
            specs.forEach(function(s) {
                out.innerHTML += '<p>' + s.series + ' ' + s.voltage + ' ' + s.cap + '</p>';
            });
        }
    } else {
        out.innerHTML = '<p style=color:red>✗ YMIN.sysMod not found</p>';
    }
} catch(e) {
    out.innerHTML = '<p style=color:red>✗ Error: ' + e.message + '</p>';
}
</script>
</body></html>
