function applyFilter(){
 var pn=document.getElementById('filterPn').value.toUpperCase();
 var s=document.getElementById('filterSeries').value;
 var pk=document.getElementById('filterPkg').value;
 var dmin=parseFloat(document.getElementById('filterDmin').value)||0;
 var dmax=parseFloat(document.getElementById('filterDmax').value)||999;
 var lmin=parseFloat(document.getElementById('filterLmin').value)||0;
 var lmax=parseFloat(document.getElementById('filterLmax').value)||999;
 var f=cadData.filter(function(r){
  if(pn&&r.pn.toUpperCase().indexOf(pn)===-1)return false;
  if(s&&r.series!==s)return false;
  if(pk&&r.pkg.indexOf(pk.replace(' (SMD)','').replace(' (Radial)','').replace(' (Snap-in)',''))===-1)return false;
  if(r.dia<dmin||r.dia>dmax)return false;
  if(r.len<lmin||r.len>lmax)return false;
  return true;
 });
 renderTable(f);
}

// ===== Three.js 3D预览（程序化模型，基于真实尺寸） =====
var ps,pc,pr,pctrl,pm,autoRot=true;
function openPreview(pn,pkg,dia,len,stepUrl){
 var m=document.getElementById('previewModal'),l=document.getElementById('previewLoading');
 var cv=document.getElementById('previewCanvas');
 document.getElementById('previewTitle').textContent=pn;
 document.getElementById('previewSubtitle').textContent=pkg+' | ø'+dia+'×'+len+'mm';
 document.getElementById('previewDim').textContent='尺寸: ø'+dia+' × '+len+' mm | 点击下载获取真实STEP模型';
 m.classList.remove('hidden');l.classList.remove('hidden');
 document.getElementById('previewLoadingText').textContent='渲染 3D 模型中...';
 if(pm){ps.remove(pm);pm=null;}
 if(pr){pr.dispose();}
 var ct=document.getElementById('preview3DContainer'),w=ct.clientWidth,h=ct.clientHeight;
 if(!ps){
  ps=new THREE.Scene();ps.background=new THREE.Color(0xf1f5f9);
  ps.add(new THREE.AmbientLight(0xffffff,0.6));
  var d1=new THREE.DirectionalLight(0xffffff,0.8);d1.position.set(10,20,10);ps.add(d1);
  var d2=new THREE.DirectionalLight(0xffffff,0.3);d2.position.set(-5,0,-5);ps.add(d2);
  ps.add(new THREE.GridHelper(40,40,0xcccccc,0xe5e7eb));
 }
 pc=new THREE.PerspectiveCamera(45,w/h,0.1,1000);pc.position.set(25,15,25);pc.lookAt(0,0,0);
 pr=new THREE.WebGLRenderer({canvas:cv,antialias:true,preserveDrawingBuffer:true});pr.setSize(w,h);pr.setPixelRatio(window.devicePixelRatio);
 pctrl=new THREE.OrbitControls(pc,cv);pctrl.enableDamping=true;pctrl.dampingFactor=0.1;pctrl.autoRotate=autoRot;pctrl.autoRotateSpeed=2;
 var group=new THREE.Group();
 var r=dia/2, h2=len/2;
 var isSMD=pkg.indexOf('贴片')>=0;
 // 主体圆柱
 var cylGeo=new THREE.CylinderGeometry(r,r,len,48);
 var cylMat=new THREE.MeshPhongMaterial({color:0x1B365D,specular:0x333333,shininess:80,transparent:true,opacity:0.85});
 group.add(new THREE.Mesh(cylGeo,cylMat));
 // 顶部铝壳
 var topGeo=new THREE.CylinderGeometry(r*0.92,r*0.92,0.3,48);
 var topMat=new THREE.MeshPhongMaterial({color:0xc0c0c0,specular:0x666666,shininess:120});
 var topCap=new THREE.Mesh(topGeo,topMat);topCap.position.y=h2;group.add(topCap);
 if(isSMD){
  // 贴片型：底座朝下 + 侧面焊盘
  var baseGeo=new THREE.CylinderGeometry(r*0.88,r*0.88,0.5,48);
  var baseMat=new THREE.MeshPhongMaterial({color:0x334155});
  var base=new THREE.Mesh(baseGeo,baseMat);base.position.y=-h2;group.add(base);
  [-1,1].forEach(function(side){
   var padGeo=new THREE.BoxGeometry(r*0.3,0.3,r*0.5);
   var padMat=new THREE.MeshPhongMaterial({color:0xc0c0c0,shininess:100});
   var pad=new THREE.Mesh(padGeo,padMat);
   pad.position.set(side*r*1.05,-h2+0.2,0);group.add(pad);
  });
 }else{
  // 引线型：引脚朝上
  var leadLen=len*0.3;
  [-1,1].forEach(function(side){
   var legGeo=new THREE.CylinderGeometry(0.25,0.25,leadLen,8);
   var legMat=new THREE.MeshPhongMaterial({color:0xc0c0c0,shininess:100});
   var leg=new THREE.Mesh(legGeo,legMat);
   leg.position.set(side*r*0.35,h2+leadLen/2,0);group.add(leg);
  });
  // 牛角型：加粗端子朝上 + 底座
  if(pkg.indexOf('牛角')>=0){
   [-1,1].forEach(function(side){
    var pinGeo=new THREE.CylinderGeometry(0.5,0.5,leadLen,8);
    var pinMat=new THREE.MeshPhongMaterial({color:0xd0d0d0,shininess:100});
    var pin=new THREE.Mesh(pinGeo,pinMat);
    pin.position.set(side*r*0.25,h2+leadLen/2,0);group.add(pin);
   });
   var basePlateGeo=new THREE.CylinderGeometry(r*0.9,r*0.9,0.4,48);
   var basePlateMat=new THREE.MeshPhongMaterial({color:0x2d3748});
   var basePlate=new THREE.Mesh(basePlateGeo,basePlateMat);
   basePlate.position.y=-h2-0.2;group.add(basePlate);
  }
 }
 // 极性标记环
 var ringGeo=new THREE.TorusGeometry(r*0.95,0.15,8,48);
 var ringMat=new THREE.MeshPhongMaterial({color:0xe8e8e8,shininess:50});
 var ring=new THREE.Mesh(ringGeo,ringMat);ring.position.y=h2-0.5;ring.rotation.x=Math.PI/2;group.add(ring);
 var maxDim=Math.max(dia,len);var sc=6/maxDim;
 group.scale.set(sc,sc,sc);
 pm=group;ps.add(pm);
 pc.position.set(12,8,18);pctrl.target.set(0,0.5,0);pctrl.update();
 l.classList.add('hidden');animateP();
}
function animateP(){requestAnimationFrame(animateP);if(pctrl)pctrl.update();if(pr&&ps&&pc)pr.render(ps,pc);}
function closePreview(e){if(e.target===document.getElementById('previewModal'))document.getElementById('previewModal').classList.add('hidden');}
document.getElementById('btnWireframe').addEventListener('click',function(){
 if(pm){
  var wf=this.textContent.trim()==='线框模式';

  this.textContent=wf?'实体模式':'线框模式';

});
document.getElementById('btnAutoRotate').addEventListener('click',function(){

 if(autoRot)this.classList.add('bg-primary/10');else this.classList.remove('bg-primary/10');
});
renderTable(cadData);
