<!DOCTYPE html>
<html class="light" lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>找回密码 - YMIN</title><meta name="description" content="重置永铭会员账户密码。">
  <link rel="icon" type="image/png" href="logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/common.css"><link rel="stylesheet" href="styles/member.css">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
</head>
<body class="member-body" data-member-title="forgotPassword">
  <header id="ymin-navbar"></header>
  <main class="member-page"><div class="member-shell">
    <nav class="member-breadcrumb"><a href="index.html" data-member-i18n="home">首页</a><span>/</span><span data-member-i18n="forgotPassword">找回密码</span></nav>
    <div class="member-layout">
      <section class="member-intro"><div class="member-kicker" data-member-i18n="freeMember">免费会员服务</div><h1 data-member-i18n="resetIntroTitle">重置会员密码</h1><p data-member-i18n="resetIntroText">使用注册邮箱确认账户并设置新密码，完成后即可重新登录会员服务。</p><ul class="member-benefits"><li><span class="material-symbols-outlined">lock_reset</span><span data-member-i18n="forgotPassword">找回密码</span></li><li><span class="material-symbols-outlined">shield_lock</span><span data-member-i18n="accountTitle">会员账户</span></li></ul></section>
      <section class="member-panel">
        <div class="member-panel-head"><div><h2 data-member-i18n="resetTitle">设置新密码</h2><p data-member-i18n="resetSubtitle">输入注册邮箱并重新设置密码</p></div><div class="member-language"><button type="button" data-member-language="zh-CN">中文</button><button type="button" data-member-language="en">EN</button></div></div>
        <form class="member-form" data-member-reset-form>
          <div class="member-field"><label for="resetEmail"><span data-member-i18n="email">邮箱</span><span class="member-required"> *</span></label><input id="resetEmail" name="email" type="email" required autocomplete="email" data-member-i18n-placeholder="emailPlaceholder" placeholder="请输入工作邮箱"></div>
          <div class="member-field"><label for="resetPassword"><span data-member-i18n="newPassword">新密码</span><span class="member-required"> *</span></label><div class="member-password-wrap"><input id="resetPassword" name="password" type="password" required minlength="8" autocomplete="new-password" data-member-i18n-placeholder="newPasswordPlaceholder" placeholder="不少于 8 位，包含字母和数字"><button class="member-password-toggle" type="button" data-member-password-toggle="resetPassword" title="显示密码"><span class="material-symbols-outlined">visibility</span></button></div></div>
          <div class="member-field"><label for="resetConfirm"><span data-member-i18n="confirmPassword">确认密码</span><span class="member-required"> *</span></label><div class="member-password-wrap"><input id="resetConfirm" name="confirmPassword" type="password" required minlength="8" autocomplete="new-password" data-member-i18n-placeholder="confirmPasswordPlaceholder" placeholder="请再次输入密码"><button class="member-password-toggle" type="button" data-member-password-toggle="resetConfirm" title="显示密码"><span class="material-symbols-outlined">visibility</span></button></div></div>
          <div class="member-message" data-member-message role="status"></div><button class="member-submit" type="submit" data-member-i18n="resetButton">重置密码</button>
        </form>
        <div class="member-form-foot"><a class="member-link" href="member-login.html" data-member-i18n="backToLogin">返回会员登录</a></div>
      </section>
    </div>
  </div></main>
  <footer id="ymin-footer"></footer>
  <script src="data/i18n-language-packs.js?v=20260807ui5"></script>
    <script src="components/i18n.js?v=20260807ui5"></script>
  <script src="components/navbar.js?v=20260807ui3"></script><script src="components/footer.js?v=20260806multi2"></script><script src="components/member.js?v=20260807ui3"></script>
  <script>document.addEventListener("DOMContentLoaded",function(){YMIN.navbar.inject();YMIN.footer.inject();YMIN.member.init();});</script>
</body>
</html>
