<!DOCTYPE html><html class="light" lang="zh-CN"><head><meta charset="utf-8"><meta content="width=device-width,initial-scale=1.0" name="viewport"><title>寿命计算工具 - 永铭电子</title><meta name="description" content="永铭电子电容寿命计算工具 - 在线交互式计算工作寿命，输入温度/电压/纹波电流参数，实时预估实际使用寿命。"><link rel="icon" type="image/png" href="logo.png"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles/common.css"><script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><script>tailwind.config={darkMode:"class",theme:{extend:{colors:{"primary":"#1B365D"},borderRadius:{"DEFAULT":"0px"},fontFamily:{"headline":["Space Grotesk"],"body":["Inter"]}}}}</script></head><body class="bg-surface text-on-surface flex flex-col h-screen overflow-hidden"><header id="ymin-navbar"></header><main class="flex-1 overflow-y-auto custom-scrollbar bg-slate-50"><div class="max-w-7xl mx-auto px-6 py-8"><nav class="text-[11px] text-slate-500 uppercase mb-6 flex gap-2"><a href="index.html" class="hover:text-primary">首页</a><span>/</span><a href="design-tools.html" class="hover:text-primary">设计工具</a><span>/</span><span class="text-primary font-bold">寿命计算工具</span></nav><div class="bg-white border border-slate-200 p-8 mb-8"><h1 class="text-3xl font-bold text-primary mb-3">电容寿命计算工具</h1><p class="text-slate-600 mb-6">基于阿伦尼乌斯(Arrhenius)寿命模型，输入实际工作条件（温度、电压、纹波电流），预估电容在特定工况下的使用寿命。适用于铝电解电容器、固液混合电容器及高分子固态电容器。</p><div class="grid grid-cols-1 md:grid-cols-2 gap-8"><div class="space-y-4"><div><label class="block text-xs font-bold text-primary uppercase mb-2">产品系列</label><select class="w-full bg-slate-50 border border-slate-200 py-2 px-3 text-sm focus:border-primary outline-none"><option>VHT - 高分子混合动力</option><option>LK - 液态引线型</option><option>NPX - 高分子固态</option><option>VPG - 液态引线型</option><option>CW3H - 牛角型</option></select></div><div><label class="block text-xs font-bold text-primary uppercase mb-2">额定电压 (V.DC)</label><input class="w-full bg-slate-50 border border-slate-200 p-2 text-sm" value="50" type="number"></div><div><label class="block text-xs font-bold text-primary uppercase mb-2">实际工作电压 (V.DC)</label><input class="w-full bg-slate-50 border border-slate-200 p-2 text-sm" value="40" type="number"></div><div><label class="block text-xs font-bold text-primary uppercase mb-2">环境温度 (°C)</label><div class="relative"><input class="w-full bg-slate-50 border border-slate-200 p-2 text-sm" value="85" type="number"><span class="absolute right-2 top-2 text-slate-400 text-sm">°C</span></div></div><div><label class="block text-xs font-bold text-primary uppercase mb-2">额定纹波电流 (mA rms)</label><input class="w-full bg-slate-50 border border-slate-200 p-2 text-sm" value="1100" type="number"></div><div><label class="block text-xs font-bold text-primary uppercase mb-2">实际纹波电流 (mA rms)</label><input class="w-full bg-slate-50 border border-slate-200 p-2 text-sm" value="800" type="number"></div><button class="w-full bg-[#1B365D] text-white py-3 text-sm font-bold mt-4">计算寿命</button></div><div class="bg-slate-50 border border-slate-200 p-6"><h3 class="text-lg font-bold text-primary mb-4 flex items-center gap-2"><span class="material-symbols-outlined">analytics</span>计算结果</h3><div class="space-y-4"><div class="flex justify-between items-center border-b pb-3"><span class="text-sm text-slate-600">额定寿命 @105°C</span><span class="text-lg font-bold text-primary">4,000 h</span></div><div class="flex justify-between items-center border-b pb-3"><span class="text-sm text-slate-600">预估实际寿命 @85°C</span><span class="text-2xl font-bold text-green-600">12,800 h</span></div><div class="flex justify-between items-center border-b pb-3"><span class="text-sm text-slate-600">寿命延长倍数</span><span class="text-lg font-bold text-primary">3.2x</span></div><div class="flex justify-between items-center"><span class="text-sm text-slate-600">年等效（24h/天运行）</span><span class="text-lg font-bold text-primary">约 1.5 年</span></div></div><p class="text-[10px] text-slate-400 mt-6">* 基于阿伦尼乌斯模型估算，实际寿命受纹波电流、频率、冷却条件等因素影响。建议结合实际应用进行验证。</p></div></div></div></div><footer id="ymin-footer"></footer></main><script src="components/navbar.js"></script><script src="components/footer.js"></script><script>document.addEventListener('DOMContentLoaded',function(){YMIN.navbar.inject('tools');YMIN.footer.inject();});</script></body></html>
