<!DOCTYPE html>
<html class="light" lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会员登录 - YMIN</title>
  <meta name="description" content="登录永铭会员，使用寿命推算、3D-CAD、SPICE、可靠性数据与专业资料下载服务。">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/common.css?v=20260807nav9">
  <link rel="stylesheet" href="styles/member.css">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
</head>
<body class="member-body" data-member-title="memberLogin">
  <header id="ymin-navbar"></header>
  <main class="member-page">
    <div class="member-shell">
      <nav class="member-breadcrumb" aria-label="面包屑">
        <a href="index.html" data-member-i18n="home">首页</a><span>/</span><span data-member-i18n="memberLogin">会员登录</span>
      </nav>
      <div class="member-layout">
        <section class="member-intro">
          <div class="member-kicker" data-member-i18n="freeMember">免费会员服务</div>
          <h1 data-member-i18n="loginIntroTitle">登录后使用专业设计资源</h1>
          <p data-member-i18n="loginIntroText">注册永铭会员，可使用设计工具、下载专业资料，并集中查看寿命推算记录。</p>
          <ul class="member-benefits">
            <li><span class="material-symbols-outlined">calculate</span><span data-member-i18n="benefitLife">寿命推算与历史记录</span></li>
            <li><span class="material-symbols-outlined">view_in_ar</span><span data-member-i18n="benefitCad">3D-CAD 模型与申请</span></li>
            <li><span class="material-symbols-outlined">memory</span><span data-member-i18n="benefitSimulation">SPICE 模型</span></li>
            <li><span class="material-symbols-outlined">verified</span><span data-member-i18n="benefitReliability">可靠性数据与合规文件</span></li>
          </ul>
        </section>
        <section class="member-panel">
          <div class="member-panel-head">
            <div><h2 data-member-i18n="loginTitle">登录永铭会员</h2><p data-member-i18n="loginSubtitle">使用注册邮箱和密码登录</p></div>
            <div class="member-language" aria-label="Language">
              <button type="button" data-member-language="zh-CN">中文</button><button type="button" data-member-language="en">EN</button>
            </div>
          </div>
          <div class="member-login-reason" data-member-login-reason>
            <span class="material-symbols-outlined">lock</span><span data-member-reason-text>该功能面向永铭会员开放，请先登录或免费注册。</span>
          </div>
          <form class="member-form" data-member-login-form novalidate>
            <div class="member-field">
              <label for="memberLoginEmail"><span data-member-i18n="email">邮箱</span><span class="member-required"> *</span></label>
              <input id="memberLoginEmail" name="email" type="email" autocomplete="username" required data-member-i18n-placeholder="emailPlaceholder" placeholder="请输入工作邮箱">
            </div>
            <div class="member-field">
              <label for="memberLoginPassword"><span data-member-i18n="password">密码</span><span class="member-required"> *</span></label>
              <div class="member-password-wrap">
                <input id="memberLoginPassword" name="password" type="password" autocomplete="current-password" required data-member-i18n-placeholder="passwordPlaceholder" placeholder="请输入密码">
                <button class="member-password-toggle" type="button" data-member-password-toggle="memberLoginPassword" data-member-i18n-title="showPassword" title="显示密码"><span class="material-symbols-outlined">visibility</span></button>
              </div>
            </div>
            <div class="member-form-row">
              <label class="member-check"><input name="remember" type="checkbox"><span data-member-i18n="rememberMe">保持登录状态</span></label>
              <a class="member-link" href="member-forgot.html" data-member-i18n="forgotLink">忘记密码？</a>
            </div>
            <div class="member-message" data-member-message role="status"></div>
            <button class="member-submit" type="submit" data-member-i18n="loginButton">登录</button>
          </form>
          <div class="member-form-foot"><span data-member-i18n="noAccount">还不是会员？</span> <a class="member-link" href="member-register.html" data-member-i18n="registerNow">免费注册</a></div>
        </section>
      </div>
    </div>
  </main>
  <footer id="ymin-footer"></footer>
  <script src="data/i18n-language-packs.js?v=20260807ui5"></script>
    <script src="components/i18n.js?v=20260807ui5"></script>
  <script src="components/navbar.js?v=20260807nav6"></script>
  <script src="components/footer.js?v=20260806multi2"></script>
  <script src="components/member.js?v=20260807ui3"></script>
  <script>document.addEventListener("DOMContentLoaded",function(){YMIN.navbar.inject();YMIN.footer.inject();YMIN.member.init();});</script>
</body>
</html>
