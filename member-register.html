<!DOCTYPE html>
<html class="light" lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会员注册 - YMIN</title>
  <meta name="description" content="免费注册永铭会员，使用专业设计工具与会员资料服务。">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/common.css">
  <link rel="stylesheet" href="styles/member.css">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
</head>
<body class="member-body" data-member-title="memberRegister">
  <header id="ymin-navbar"></header>
  <main class="member-page">
    <div class="member-shell">
      <nav class="member-breadcrumb" aria-label="面包屑"><a href="index.html" data-member-i18n="home">首页</a><span>/</span><span data-member-i18n="memberRegister">会员注册</span></nav>
      <div class="member-layout">
        <section class="member-intro">
          <div class="member-kicker" data-member-i18n="freeMember">免费会员服务</div>
          <h1 data-member-i18n="registerIntroTitle">一个账户，连接设计与应用支持</h1>
          <p data-member-i18n="registerIntroText">会员注册免费。请填写真实的企业与联系信息，便于获取适合项目的产品与技术支持。</p>
          <ul class="member-benefits">
            <li><span class="material-symbols-outlined">calculate</span><span data-member-i18n="benefitLife">寿命推算与历史记录</span></li>
            <li><span class="material-symbols-outlined">view_in_ar</span><span data-member-i18n="benefitCad">3D-CAD 模型与申请</span></li>
            <li><span class="material-symbols-outlined">memory</span><span data-member-i18n="benefitSimulation">SPICE 模型</span></li>
            <li><span class="material-symbols-outlined">verified</span><span data-member-i18n="benefitReliability">可靠性数据与合规文件</span></li>
          </ul>
        </section>
        <section class="member-panel">
          <div class="member-panel-head">
            <div><h2 data-member-i18n="registerTitle">注册永铭会员</h2><p data-member-i18n="registerSubtitle">填写以下信息即可免费注册</p></div>
            <div class="member-language"><button type="button" data-member-language="zh-CN">中文</button><button type="button" data-member-language="en">EN</button></div>
          </div>
          <form class="member-form member-form-grid" data-member-register-form>
            <div class="member-field member-span-2"><label for="memberCompany"><span data-member-i18n="company">公司名称</span><span class="member-required"> *</span></label><input id="memberCompany" name="company" required autocomplete="organization" data-member-i18n-placeholder="companyPlaceholder" placeholder="请输入公司全称"></div>
            <div class="member-field"><label for="memberDepartment"><span data-member-i18n="department">部门</span><span class="member-required"> *</span></label><input id="memberDepartment" name="department" required autocomplete="organization-title" data-member-i18n-placeholder="departmentPlaceholder" placeholder="请输入所在部门"></div>
            <div class="member-field"><label for="memberName"><span data-member-i18n="name">姓名</span><span class="member-required"> *</span></label><input id="memberName" name="name" required autocomplete="name" data-member-i18n-placeholder="namePlaceholder" placeholder="请输入姓名"></div>
            <div class="member-field"><label for="memberEmail"><span data-member-i18n="email">邮箱</span><span class="member-required"> *</span></label><input id="memberEmail" name="email" type="email" required autocomplete="email" data-member-i18n-placeholder="emailPlaceholder" placeholder="请输入工作邮箱"></div>
            <div class="member-field"><label for="memberPhone"><span data-member-i18n="phone">联系电话</span><span class="member-required"> *</span></label><input id="memberPhone" name="phone" type="tel" required autocomplete="tel" data-member-i18n-placeholder="phonePlaceholder" placeholder="请输入联系电话"></div>
            <div class="member-field member-span-2"><label for="memberRegion"><span data-member-i18n="region">国家 / 地区</span><span class="member-required"> *</span></label><select id="memberRegion" name="region" data-member-region-select required><option value="" selected disabled>请选择国家 / 地区</option></select></div>
            <div class="member-field"><label for="memberPassword"><span data-member-i18n="password">密码</span><span class="member-required"> *</span></label><div class="member-password-wrap"><input id="memberPassword" name="password" type="password" required autocomplete="new-password" minlength="8" data-member-i18n-placeholder="newPasswordPlaceholder" placeholder="不少于 8 位，包含字母和数字"><button class="member-password-toggle" type="button" data-member-password-toggle="memberPassword" data-member-i18n-title="showPassword" title="显示密码"><span class="material-symbols-outlined">visibility</span></button></div></div>
            <div class="member-field"><label for="memberConfirmPassword"><span data-member-i18n="confirmPassword">确认密码</span><span class="member-required"> *</span></label><div class="member-password-wrap"><input id="memberConfirmPassword" name="confirmPassword" type="password" required autocomplete="new-password" minlength="8" data-member-i18n-placeholder="confirmPasswordPlaceholder" placeholder="请再次输入密码"><button class="member-password-toggle" type="button" data-member-password-toggle="memberConfirmPassword" data-member-i18n-title="showPassword" title="显示密码"><span class="material-symbols-outlined">visibility</span></button></div></div>
            <label class="member-check member-span-2"><input name="terms" type="checkbox" required><span><span data-member-i18n="acceptTermsPrefix">我已阅读并同意</span> <a href="member-terms.html" target="_blank" data-member-i18n="acceptTermsLink">《会员服务条款》</a></span></label>
            <label class="member-check member-span-2"><input name="nonMilitary" type="checkbox" required><span data-member-i18n="nonMilitary">我确认会员资源不用于军事用途或受限制用途</span></label>
            <label class="member-check member-span-2"><input name="newsletter" type="checkbox"><span data-member-i18n="newsletter">订阅永铭产品、技术与活动资讯</span></label>
            <div class="member-message member-span-2" data-member-message role="status"></div>
            <button class="member-submit member-span-2" type="submit" data-member-i18n="registerButton">免费注册</button>
          </form>
          <div class="member-form-foot"><span data-member-i18n="hasAccount">已有会员账户？</span> <a class="member-link" href="member-login.html" data-member-i18n="loginNow">立即登录</a></div>
        </section>
      </div>
    </div>
  </main>
  <footer id="ymin-footer"></footer>
  <script src="data/i18n-language-packs.js?v=20260807ui5"></script>
    <script src="components/i18n.js?v=20260807ui5"></script>
  <script src="components/navbar.js?v=20260807ui3"></script><script src="components/footer.js?v=20260806multi2"></script><script src="components/member.js?v=20260807ui3"></script>
  <script>document.addEventListener("DOMContentLoaded",function(){YMIN.navbar.inject();YMIN.footer.inject();YMIN.member.init();});</script>
</body>
</html>
