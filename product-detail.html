                <div class="bg-white border border-slate-200 p-8 mb-8"><h2 class="text-2xl font-bold text-primary mb-6 flex items-center gap-3"><span class="material-symbols-outlined text-2xl">newspaper</span>相关技术文章与新闻</h2><div class="space-y-5">${prod.relatedArticles.map(art => `<div class="border-b pb-4 last:border-0"><div class="flex justify-between"><div><span class="text-[10px] font-bold uppercase px-2 py-0.5 bg-slate-100">${art.category}</span><h4 class="font-bold text-primary mt-2 hover:underline cursor-pointer">${art.title}</h4><p class="text-xs text-slate-500 mt-1">${art.date}</p></div><span class="material-symbols-outlined text-slate-400">arrow_forward</span></div></div>`).join('')}</div><a href="#" class="inline-block mt-5 text-primary text-xs font-bold uppercase hover:underline">浏览全部文章 →</a></div>
