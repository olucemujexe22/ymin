<!DOCTYPE html>
<html class="light" lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代理商网络 - 上海永铭电子股份有限公司</title>
    <meta name="description" content="查询上海永铭电子股份有限公司公开授权代理商名录和授权日期，核验永铭品牌电容器代理资格。">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@300..700&display=swap">
    <link rel="stylesheet" href="styles/common.css">
    <link rel="stylesheet" href="styles/about.css?v=20260803d">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>tailwind.config={darkMode:'class',theme:{extend:{colors:{primary:'#1B365D'},borderRadius:{DEFAULT:'0px'},fontFamily:{headline:['Space Grotesk'],body:['Inter']}}}}</script>
</head>
<body class="bg-slate-50 text-slate-900 flex flex-col h-screen overflow-hidden" data-about-page="distributors">
    <header id="ymin-navbar"></header>
    <main class="about-main flex-1 overflow-y-auto custom-scrollbar">
        <section class="about-hero about-distributor-hero">
            <div class="about-hero-content about-distributor-hero-layout">
                <div class="about-distributor-hero-copy">
                    <h1>代理商网络</h1>
                    <p>查询永铭公开授权代理商名录。采购前建议核验代理资格、授权有效期与证书信息。</p>
                </div>
                <div class="about-distributor-hero-image">
                    <img src="assets/about/distributor-banner.webp" data-distributor-banner data-src-zh="assets/about/distributor-banner.webp" data-src-en="assets/about/distributor-banner-en.png" alt="永铭代理商资格证样式" loading="eager">
                </div>
            </div>
        </section>

        <section class="about-section">
            <div class="about-container">
                <div class="about-section-head">
                    <div><h2>授权代理商查询</h2><p>输入公司名称或按授权年份筛选。列表按授权日期由近到远排列。</p></div>
                </div>
                <div class="about-toolbar">
                    <label class="about-field">
                        <span class="material-symbols-outlined">search</span>
                        <input class="about-input" type="search" placeholder="输入代理商完整或部分名称" data-distributor-search aria-label="搜索代理商名称">
                    </label>
                    <select class="about-select" data-distributor-year aria-label="选择授权年份"></select>
                    <span class="about-table-count" data-distributor-count>共 89 家</span>
                </div>
                <div class="about-table-wrap">
                    <table class="about-table">
                        <thead><tr><th scope="col" style="width:90px">序号</th><th scope="col">代理商名称</th><th scope="col" style="width:180px">授权日期</th></tr></thead>
                        <tbody data-distributor-body></tbody>
                    </table>
                </div>
                <div class="about-pagination">
                    <span data-distributor-summary></span>
                    <div class="about-page-buttons"><button type="button" data-page-prev aria-label="上一页"><span class="material-symbols-outlined text-base">chevron_left</span></button><button type="button" disabled data-page-label aria-label="当前页"></button><button type="button" data-page-next aria-label="下一页"><span class="material-symbols-outlined text-base">chevron_right</span></button></div>
                </div>
                <div class="about-notice" style="margin-top:26px"><span class="material-symbols-outlined">verified</span><div>代理资格及有效期以永铭盖章证书和最新公开名录为准。若名录信息与所持证书存在差异，请联系永铭进行核验。</div></div>
            </div>
        </section>

        <footer id="ymin-footer"></footer>
    </main>
    <script src="components/i18n.js?v=20260805film1"></script>
    <script src="components/navbar.js?v=20260805logo1"></script>
    <script src="components/footer.js?v=20260805film1"></script>
    <script src="data/about-content.js?v=20260805film1"></script>
    <script src="data/about-distributors-en.js?v=20260805merge1"></script>
    <script src="components/about-pages.js?v=20260805merge2"></script>
    <script>document.addEventListener('DOMContentLoaded',function(){YMIN.navbar.inject('about');YMIN.footer.inject();});</script>
</body>
</html>
