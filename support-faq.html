<!DOCTYPE html>
<html class="light" lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width,initial-scale=1.0" name="viewport">
    <title>FAQ知识库 - 永铭电子</title>
    <meta name="description" content="永铭电子电容知识库，支持按应用、产品系列和问题类型检索选型、参数、安装、可靠性等常见技术问题。">
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/common.css">
    <link rel="stylesheet" href="styles/support-content.css">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config={darkMode:"class",theme:{extend:{colors:{"primary":"#1B365D"},borderRadius:{"DEFAULT":"0px"},fontFamily:{"headline":["Space Grotesk"],"body":["Inter"]}}}}
    </script>
</head>
<body data-support-page="faq-list" class="bg-surface text-on-surface flex flex-col h-screen overflow-hidden">
    <header id="ymin-navbar"></header>
    <main class="support-page flex-1 overflow-y-auto custom-scrollbar">
        <div class="support-container">
            <nav class="support-breadcrumb" aria-label="面包屑">
                <a href="index.html">首页</a><span>/</span>
                <a href="support.html">服务支持</a><span>/</span>
                <span>FAQ知识库</span>
            </nav>
            <section class="support-hero">
                <div class="support-hero-grid">
                    <div>
                        <div class="support-kicker">TECHNICAL KNOWLEDGE BASE</div>
                        <h1>先找到答案，再开始选型</h1>
                        <p>围绕真实应用问题组织技术解答。可按应用、产品系列或问题类型检索，并继续查看相关技术文章、规格资料与设计工具。</p>
                    </div>
                    <div class="support-stat-row" aria-label="知识库内容统计">
                        <div class="support-stat"><strong data-faq-count>—</strong><span>技术问答</span></div>
                        <div class="support-stat"><strong data-article-count>—</strong><span>完整文章</span></div>
                    </div>
                </div>
            </section>
            <div class="support-search" role="search">
                <span class="material-symbols-outlined">search</span>
                <input id="support-global-search" type="search" placeholder="输入问题、系列、应用或参数，例如：105℃寿命、贴片、LKM">
                <button id="faq-search-button" type="button">搜索答案</button>
            </div>
            <section class="support-section" aria-labelledby="faq-app-title">
                <div class="support-section-heading">
                    <div>
                        <h2 id="faq-app-title">按应用快速进入</h2>
                        <p>从设备场景出发，减少在产品分类之间反复查找。</p>
                    </div>
                    <a class="support-text-link" href="application-center.html">查看应用中心
                        <span class="material-symbols-outlined">arrow_forward</span>
                    </a>
                </div>
                <div class="support-apps" id="faq-app-buttons" aria-label="应用筛选"></div>
            </section>
            <section class="support-content-grid" aria-label="FAQ筛选与结果">
                <aside class="support-filter-panel">
                    <h3>筛选答案<span class="material-symbols-outlined">tune</span></h3>
                    <div class="support-filter-group">
                        <label class="support-filter-label">问题类型</label>
                        <div class="support-chip-list" id="faq-type-chips"></div>
                    </div>
                    <div class="support-filter-group">
                        <label class="support-filter-label" for="faq-app-select">应用领域</label>
                        <select class="support-select" id="faq-app-select"></select>
                    </div>
                    <div class="support-filter-group">
                        <label class="support-filter-label" for="faq-series-select">产品系列</label>
                        <select class="support-select" id="faq-series-select"></select>
                    </div>
                    <button class="support-reset" id="faq-reset" type="button">清除全部筛选</button>
                </aside>
                <div class="support-results">
                    <div class="support-toolbar">
                        <div class="support-result-count" id="faq-count">正在读取知识库…</div>
                        <div class="support-active-filters" id="faq-active-filters"></div>
                    </div>
                    <div class="faq-list" id="faq-results">
                        <div class="support-loading">
                            <span class="material-symbols-outlined">progress_activity</span>
                            正在加载FAQ
                        </div>
                    </div>
                    <div class="support-pagination" id="faq-pagination"></div>
                </div>
            </section>
        </div>
        <footer id="ymin-footer"></footer>
    </main>
    <script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>
    <script src="components/support-content.js"></script>
</body>
</html>
